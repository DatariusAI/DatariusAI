name: Refresh arXiv feed

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update README
        run: python scripts/update_arxiv.py
      # main is protected and needs a pull request, so the bot opens one and merges it.
      - name: Open and merge a pull request if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          branch="arxiv-feed-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Refresh arXiv feed"
          git push -u origin "$branch"
          if ! gh pr create --base main --head "$branch" --title "Refresh arXiv feed" --body "Daily automatic update of the Fresh from arXiv list."; then
            echo "::error::Could not open a pull request. Turn on Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'."
            git push origin --delete "$branch"
            exit 1
          fi
          gh pr merge "$branch" --squash --delete-branch
