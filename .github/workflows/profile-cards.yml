name: Refresh profile cards

on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Cards are published to the "output" branch, so the protected main branch is never touched.
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stats and language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_cards.py dist
      - name: Build contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#38bdae&color_dots=#1a1b27,#0e4429,#006d32,#26a641,#39d353
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
