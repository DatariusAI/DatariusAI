<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Mohammad Alrashed, DatariusAI: AI and digital transformation leader, AI/ML engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1225"/>
      <stop offset="1" stop-color="#1a1b27"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#70a5fd"/>
      <stop offset="1" stop-color="#bf91f3"/>
    </linearGradient>
  </defs>
  <style>
    .name{font:700 40px 'Segoe UI',Ubuntu,sans-serif;fill:url(#name)}
    .sub{font:500 17px 'Segoe UI',Ubuntu,sans-serif;fill:#c0caf5}
    .rot{font:600 15px 'Fira Code','Consolas',monospace;fill:#38bdae}
    .dot{fill:#70a5fd;opacity:.35}
  </style>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <g class="dot">
    <circle cx="770" cy="40" r="3"/><circle cx="820" cy="70" r="2"/><circle cx="860" cy="35" r="2.5"/>
    <circle cx="800" cy="120" r="2"/><circle cx="850" cy="150" r="3"/><circle cx="740" cy="160" r="2"/>
  </g>
  <g stroke="#70a5fd" stroke-opacity=".18">
    <line x1="770" y1="40" x2="820" y2="70"/><line x1="820" y1="70" x2="860" y2="35"/>
    <line x1="820" y1="70" x2="800" y2="120"/><line x1="800" y1="120" x2="850" y2="150"/><line x1="800" y1="120" x2="740" y2="160"/>
  </g>
  <text x="450" y="78" text-anchor="middle" class="name">Mohammad Alrashed</text>
  <text x="450" y="110" text-anchor="middle" class="sub">AI &amp; Digital Transformation Leader in Banking · AI/ML Engineer · DatariusAI</text>
  <text x="450" y="155" text-anchor="middle" class="rot">&gt; LLMs · Agentic AI · MLOps · AI Governance · Cloud AI · Teaching AI in English &amp; Arabic</text>
</svg>
