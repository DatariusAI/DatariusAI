<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Mohammad Alrashed, DatariusAI: AI and digital transformation leader, AI/ML engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="0.5" stop-color="#a5c8ff"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <style>
    .name{font:700 40px 'Segoe UI',Ubuntu,sans-serif;fill:url(#name)}
    .sub{font:500 17px 'Segoe UI',Ubuntu,sans-serif;fill:#c9d1d9}
    .rot{font:600 15px 'Fira Code','Consolas',monospace;fill:#58a6ff}
    .dot{fill:#58a6ff;opacity:.25}
  </style>
  <rect x=".5" y=".5" width="899" height="199" rx="12" fill="url(#bg)" stroke="#30363d"/>
  <text x="450" y="78" text-anchor="middle" class="name">Mohammad Alrashed</text>
  <text x="450" y="110" text-anchor="middle" class="sub">AI &amp; Digital Transformation Leader in Banking · AI/ML Engineer · DatariusAI</text>
  <text x="450" y="155" text-anchor="middle" class="rot">LLMs · Agentic AI · MLOps · AI Governance · Cloud AI</text>
</svg>
